services:
  - type: web
    name: guildsmith
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
